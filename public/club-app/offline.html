<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0B09">
  <title>Je bent offline</title>
  <link rel="icon" href="/club-app/icoon-192.png" type="image/png">
  <style>
    :root {
      --bg: #0A0B09;
      --kaart: #141513;
      --lijn: rgba(255, 255, 255, 0.08);
      --tekst-1: rgba(255, 255, 255, 0.96);
      --tekst-2: rgba(255, 255, 255, 0.7);
      --accent: #D9D6CF;
      --accent-inkt: #0A0B09;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F4F3EF;
        --kaart: #FFFFFF;
        --lijn: rgba(17, 17, 15, 0.1);
        --tekst-1: rgba(17, 17, 15, 0.92);
        --tekst-2: rgba(17, 17, 15, 0.7);
        --accent: #2B2A27;
        --accent-inkt: #FFFFFF;
        color-scheme: light;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--tekst-1);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(420px, 100%);
      padding: 36px 28px 30px;
      border: 1px solid var(--lijn);
      border-radius: 20px;
      background: var(--kaart);
      text-align: left;
    }
    .teken { width: 44px; height: 44px; margin-bottom: 28px; color: var(--tekst-2); }
    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }
    p { margin: 0 0 28px; font-size: 16px; line-height: 1.55; color: var(--tekst-2); }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-inkt);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      transition: transform 120ms ease, opacity 160ms ease;
    }
    a:hover { opacity: 0.9; }
    a:active { transform: translateY(1px); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <svg class="teken" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.46"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/>
    </svg>
    <h1>Je bent offline</h1>
    <p>Er is nu geen internet. Je lessen, afspraken en schema laden weer zodra je verbinding hebt.</p>
    <a href="/mijn">Opnieuw proberen</a>
  </main>
</body>
</html>
