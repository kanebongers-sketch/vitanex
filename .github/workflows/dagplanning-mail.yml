name: Dagplanning mail
on:
  schedule:
    # ma–vr, elke 30 min van 05:00–08:30 UTC (07:00–10:30 NL zomer / 06:00–09:30 winter).
    # GitHub laat geplande tikken onder drukte soms vallen; daarom meerdere pogingen.
    # De route stuurt hooguit één mail per dag (de claim is het slot) en stopt bij
    # elke volgende poging goedkoop — de eerste die landt wint, de rest doet niets.
    - cron: '0,30 5-8 * * 1-5'
  workflow_dispatch:
concurrency:
  group: dagplanning-mail
  cancel-in-progress: false
jobs:
  dagplanning:
    runs-on: ubuntu-latest
    steps:
      - name: Plan de blokken en stuur de dagplanning
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          [ -z "${CRON_SECRET}" ] && { echo "::error::CRON_SECRET ontbreekt"; exit 1; }
          status=$(curl -sS --max-time 60 -o response.json -w '%{http_code}' \
            -H "x-cron-secret: ${CRON_SECRET}" \
            https://mentaforce.nl/api/cron/dagplanning-mail)
          echo "HTTP ${status}"; cat response.json; echo
          [ "${status}" != "200" ] && { echo "::error::route gaf ${status}"; exit 1; } || true
