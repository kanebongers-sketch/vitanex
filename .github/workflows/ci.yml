# CI-vangnet: elke push naar main en elke PR wordt getypecheckt en getest,
# en gebouwd, zodat build-fouten hier stranden in plaats van pas bij de Render-deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # De repo is openbaar: een per ongeluk gecommitte sleutel staat meteen op
      # straat. Deze stap faalt vóór er iets geïnstalleerd wordt op de bekende
      # vormen van tokens (Supabase/JWT, Anthropic, Stripe, AWS, GitHub, Slack,
      # Resend, private keys) en op env-bestanden in de boom. Geen externe
      # dienst, geen token nodig. Bewust streng op vorm, niet op naam: een
      # variabele die `KEY` heet is geen lek, een `eyJ…` van drie delen wél.
      - name: Geheimen-check (gecommitte sleutels)
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -vE '(^|/)\.env\.example$'; then
            echo '::error::Er staat een .env-bestand in git.'; exit 1
          fi
          PATROON='eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|sk_(live|test)_[A-Za-z0-9]{20,}|rk_(live|test)_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}|re_[A-Za-z0-9]{20,}_[A-Za-z0-9]{10,}|-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}'
          if git ls-files -z | xargs -0 grep -nE "$PATROON" -- 2>/dev/null; then
            echo '::error::Er lijkt een sleutel of token in de code te staan (zie regels hierboven). Haal hem weg én roteer hem.'; exit 1
          fi
          echo 'Geen sleutels gevonden.'

      - uses: actions/setup-node@v4
        with:
          # Zelfde major als Render (24.x) zodat CI en deploy hetzelfde gedrag zien.
          node-version: 24
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Typecheck (next typegen + tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      # Een kapotte build (bv. een CSS-syntaxfout) haalt typecheck en tests wél;
      # zonder deze stap strandt hij pas op Render. Dummy-waarden: de build leest
      # alleen of ze bestaan, er wordt niets aangeroepen.
      - name: Productiebuild (next build)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy
