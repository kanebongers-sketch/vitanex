# LifeOS week-terugblik — de maandagochtend-mail die je week samenvat.
#
# Render kent geen cron-veld in de repo en er is geen vercel.json, dus de klok
# staat hier. Zelfde patroon als lifeos-agenda-sync.yml / dagplanning-mail.yml.
#
# EERST DIT ZETTEN, anders doet deze workflow niets:
#   1. GitHub → Settings → Secrets and variables → Actions → `CRON_SECRET`,
#      met dezelfde waarde als `CRON_SECRET` in de Render-omgeving.
#      (Dezelfde secret die de dagmail en agenda-sync al gebruiken — niets extra's.)
#   2. Draai 'm één keer handmatig (Run workflow) en kijk of er een mail binnenkomt.
#
# DIT IS DE ENIGE PLANNER voor deze route: de route claimt daarom géén per-dag-slot
# (zie de kop van route.ts). De concurrency-guard hieronder houdt twee runs uit
# elkaar; laat 'm staan.
#
# TIJDZONE: GitHub-cron draait op UTC zonder zomertijd. 06:00 UTC is 08:00 NL in de
# zomer en 07:00 in de winter — een terugblik hoeft niet op de minuut.
#
# BETROUWBAARHEID: GitHub voert scheduled workflows soms met vertraging uit en kan
# ze bij drukte overslaan. Een gemiste maandag is een gemiste terugblik, geen ramp.

name: LifeOS week-terugblik

on:
  schedule:
    - cron: '0 6 * * 1' # maandag 08:00 NL zomertijd, 07:00 wintertijd
  workflow_dispatch:

concurrency:
  group: lifeos-weekmail
  cancel-in-progress: false

jobs:
  weekmail:
    runs-on: ubuntu-latest
    steps:
      - name: Stuur de week-terugblik
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET ontbreekt in de repo-secrets. De route is fail-closed en zou 401 geven."
            exit 1
          fi

          # De secret gaat als header mee, niet als query-parameter: query-strings
          # belanden in access-logs.
          status=$(curl -sS --max-time 60 \
            -o response.json -w '%{http_code}' \
            -H "x-cron-secret: ${CRON_SECRET}" \
            https://mentaforce.nl/api/cron/lifeos-weekmail)

          echo "HTTP ${status}"
          cat response.json
          echo

          if [ "${status}" != "200" ]; then
            echo "::error::De weekmail-route gaf ${status}. Er is niets verstuurd."
            exit 1
          fi
